apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  labels:
    app: spark-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-master
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z spark-master 7077; do echo 'attente master'; sleep 3; done"]
      containers:
        - name: spark-worker
          image: spark:3.5.3-python3
          env:
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          command: ["/opt/spark/bin/spark-class"]
          args:
            - org.apache.spark.deploy.worker.Worker
            - spark://spark-master:7077   # nom du Service K8s
            - --host
            - $(POD_IP)
            - --cores
            - "1"                         # 2 dans Compose, réduit pour Minikube
            - --memory
            - 1G                          # 2G dans Compose, réduit pour Minikube
            - --webui-port
            - "8081"
          ports:
            - name: webui
              containerPort: 8081
