apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  labels:
    app: spark-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      enableServiceLinks: false
      containers:
        - name: spark-master
          image: spark:3.5.3-python3      # image officielle multi-arch
          env:
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          command: ["/opt/spark/bin/spark-class"]
          args:
            - org.apache.spark.deploy.master.Master
            - --host
            - $(POD_IP)
            - --port
            - "7077"
            - --webui-port
            - "8080"
          ports:
            - name: cluster
              containerPort: 7077
            - name: webui
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master
spec:
  selector:
    app: spark-master
  ports:
    - name: cluster
      port: 7077
      targetPort: cluster
    - name: webui
      port: 8080
      targetPort: webui
